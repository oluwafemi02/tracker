name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App checks (syntax, unit tests, offline file list)
        run: npm run check
      - name: Push server tests
        working-directory: push-worker
        run: |
          npm install --no-audit --no-fund
          npm test
