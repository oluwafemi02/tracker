name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts || npm i --ignore-scripts
      - run: npm run check:versions
      - run: npm run check:manifest
      - run: npm run check:duplicates
      - run: npm run check:smoke
      - run: npm run lint
