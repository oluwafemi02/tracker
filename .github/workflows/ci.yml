name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App checks (syntax, unit tests, offline file list)
        run: npm run check
      - name: Push server tests
        working-directory: push-worker
        run: |
          npm install --no-audit --no-fund
          npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (iPhone size, WebKit and Chromium)
        run: npx playwright test -c e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
            test-results/
          retention-days: 7
