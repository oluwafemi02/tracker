name: Deploy push server
# Deploys push-worker/ to your Cloudflare account. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (token from the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID
# First run creates the storage and the signing keys; later runs only update the code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'push-worker/**'
      - 'js/ics.js'
      - 'js/dates.js'
      - 'js/money.js'
      - '.github/workflows/push-server.yml'

concurrency: push-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: push-worker
    steps:
      - name: Check Cloudflare secrets
        id: check
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          msg="Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions. See push-worker/README.md."
          # Automatic runs skip quietly until the push server is set up; manual runs fail with the reason.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
          echo "::notice::Push server not set up yet. $msg"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Install
        if: steps.check.outputs.ok == 'true'
        run: npm install --no-audit --no-fund
      - name: Tests
        if: steps.check.outputs.ok == 'true'
        run: npm test

      - name: Storage (KV namespace)
        if: steps.check.outputs.ok == 'true'
        run: |
          find_id() { npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const n=JSON.parse(s.slice(s.indexOf("[")));const m=n.find(x=>x.title==="tracker-push-DEVICES"||x.title==="DEVICES");if(m)console.log(m.id)}catch{}})'; }
          id=$(find_id || true)
          if [ -z "$id" ]; then
            echo "Creating storage"
            npx wrangler kv namespace create DEVICES
            id=$(find_id || true)
          fi
          [ -n "$id" ] || { echo "::error::Could not create or find the KV namespace. Check the API token has Workers KV Storage: Edit."; exit 1; }
          sed -i "s/PASTE_YOUR_KV_NAMESPACE_ID_HERE/$id/" wrangler.toml
          echo "Storage ready"

      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        id: deploy
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -qi "workers.dev subdomain" /tmp/deploy.log; then
            echo "::error::Open dash.cloudflare.com, go to Workers & Pages once so Cloudflare creates your workers.dev address, then run this workflow again."
          fi
          [ "$status" = 0 ] || exit "$status"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Signing keys (first run only)
        if: steps.check.outputs.ok == 'true'
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q VAPID_PRIVATE_JWK; then
            echo "Keys already set"
          else
            dir=$(mktemp -d)
            node scripts/gen-vapid.mjs --out "$dir"
            npx wrangler secret put VAPID_PUBLIC_KEY < "$dir/public.txt"
            npx wrangler secret put VAPID_PRIVATE_JWK < "$dir/private.json"
            rm -rf "$dir"
            echo "Keys created and stored in Cloudflare"
          fi

      - name: Check the server answers
        if: steps.check.outputs.ok == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          [ -n "$url" ] || { echo "::warning::Deployed, but the address was not in the output. Find it in the Cloudflare dashboard under Workers & Pages, tracker-push."; exit 0; }
          key=""
          for i in 1 2 3 4 5 6; do
            key=$(curl -fsS "$url/vapid" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).publicKey||"")}catch{}})') && [ -n "$key" ] && break
            sleep 5
          done
          [ -n "$key" ] || { echo "::error::$url/vapid did not return a key"; exit 1; }
          {
            echo "## Push server is live"
            echo ""
            echo "Paste this address in Tracker, Settings, Reminders, Push notifications:"
            echo ""
            echo '```'
            echo "$url"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Push server address: $url"
