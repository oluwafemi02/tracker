name = "tracker-push"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Check for due reminders every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

# The deploy workflow fills in the id. By hand: npx wrangler kv namespace create DEVICES
[[kv_namespaces]]
binding = "DEVICES"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# Contact for push services (Apple requires a mailto: or https: address).
VAPID_SUBJECT = "https://oluwafemi02.github.io/tracker/"
# Only accept requests from your app. Change if you host it elsewhere.
ALLOWED_ORIGIN = "https://oluwafemi02.github.io"
MAX_DEVICES = "5"
# VAPID_PUBLIC_KEY and VAPID_PRIVATE_JWK are Cloudflare secrets, created on the first deploy.
