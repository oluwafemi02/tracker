<!DOCTYPE html>
<html lang="en-GB" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker</title>
  <meta name="description" content="Personal expenses, bills with reminders, and trips.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'">
  <meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12201c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app" id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <button class="tab" data-action="tab" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
        Home
      </button>
      <button class="tab" data-action="tab" data-tab="activity">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M5 19V11M10 19V5M15 19v-6M20 19V8"/></svg>
        Activity
      </button>
      <button class="fab" data-action="add" aria-label="Add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-action="tab" data-tab="bills">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M8 3v4M16 3v4M4 10h16"/><circle cx="15.5" cy="15" r="1.6" fill="currentColor"/></svg>
        Bills<span class="dot" hidden></span>
      </button>
      <button class="tab" data-action="tab" data-tab="trips">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M10.5 13.5 4 11l1.2-1.6 7 .6 4.3-4.5c.9-.9 2.4-1 3.2-.2.8.8.7 2.3-.2 3.2L15 13l.6 7-1.6 1.2-2.5-6.5-3 3 .2 2.3L7.5 21l-1.3-3.2L3 16.5l1-1.2 2.3.2z"/></svg>
        Trips
      </button>
    </div>
  </nav>

  <noscript><p style="padding:2rem">Tracker needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
